<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniela & Pedro — Photobooth</title><link rel="stylesheet" href="css/style.css"></head><body><main class="app"><header><div class="eyebrow">O nosso casamento</div><h1>Daniela <span>&</span> Pedro</h1><p>Guarda um momento especial connosco ♡</p></header><section class="camera-card"><div class="camera-view"><video id="video" autoplay muted playsinline></video><canvas id="canvas" hidden></canvas><img id="preview" alt="Fotografia capturada" hidden><div id="camera-msg">Toca em «Abrir câmara» para começar.</div></div><div class="controls"><button id="start">Abrir câmara</button><button id="flip" disabled>Trocar câmara</button><button id="snap" disabled>Fotografar</button><button id="retry" hidden>Repetir</button></div><div id="editing" hidden><h2>Escolhe a moldura</h2><div class="controls"><button data-frame="none">Sem moldura</button><button data-frame="polaroid">Polaroid</button><button data-frame="elegant">Elegante</button></div><p id="frame-name"></p><div class="controls"><button id="download-original">Descarregar original</button><button id="download-framed">Descarregar com moldura</button></div></div></section><p class="footnote">Protótipo: as fotografias ficam apenas no teu telemóvel. O envio para a cloud será adicionado na próxima fase.</p></main><script src="js/app.js"></script></body></html>
